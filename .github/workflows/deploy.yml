name: Deploy Voting App

on:
  pull_request:
    branches: [main]
    paths: ['services/**', 'infra/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['services/**', 'infra/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -no-color
        working-directory: infra
      - name: validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Check if tag exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "${{ vars.NAME_PREFIX }}-${{ matrix.service }}" \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (push only on main)
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.NAME_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  plan:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: init
        working-directory: infra
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=voting-app/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: plan
        working-directory: infra
        run: |
          terraform plan -input=false -no-color -lock=false \
            -var-file=envs/${{ matrix.env }}.tfvars \
            -var="env=${{ matrix.env }}" \
            -var="name_prefix=${{ vars.NAME_PREFIX }}" \
            -var="image_tag=${{ github.sha }}"

  deploy-dev:
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: dev
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy-prod:
    if: github.event_name != 'pull_request'
    needs: deploy-dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: prod
      image_tag: ${{ github.sha }}
    secrets: inherit
