name: Deploy Voting App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      vote: ${{ steps.filter.outputs.vote }}
      result: ${{ steps.filter.outputs.result }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vote:
              - 'services/vote/**'
            result:
              - 'services/result/**'
            worker:
              - 'services/worker/**'

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push vote
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/${{ vars.NAME_PREFIX }}-vote:${{ github.sha }} services/vote
          docker push $REGISTRY/${{ vars.NAME_PREFIX }}-vote:${{ github.sha }}

      - name: Build and push result
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/${{ vars.NAME_PREFIX }}-result:${{ github.sha }} services/result
          docker push $REGISTRY/${{ vars.NAME_PREFIX }}-result:${{ github.sha }}

      - name: Build and push worker
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/${{ vars.NAME_PREFIX }}-worker:${{ github.sha }} services/worker
          docker push $REGISTRY/${{ vars.NAME_PREFIX }}-worker:${{ github.sha }}

  terraform-apply-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=voting-app/dev/terraform.tfstate" \
            -backend-config="region=eu-north-1" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var-file=envs/dev.tfvars \
            -var="image_tag=${{ github.sha }}"

  terraform-apply-prod:
    runs-on: ubuntu-latest
    needs: terraform-apply-dev
    environment: prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=voting-app/prod/terraform.tfstate" \
            -backend-config="region=eu-north-1" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var-file=envs/prod.tfvars \
            -var="image_tag=${{ github.sha }}"
